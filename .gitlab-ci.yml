# Type-check and test datme on every push and merge request.
image: oven/bun:1

variables:
  ASTRO_TELEMETRY_DISABLED: "1"

cache:
  key:
    files: [bun.lock]
  paths: [node_modules/]

test:
  script:
    - bun install --frozen-lockfile
    - bunx astro check
    - bun test

obsidian-plugin:
  script:
    - cd obsidian-plugin
    - bun install --frozen-lockfile
    - bun run check
    - bun run test
    - bun run build
  artifacts:
    paths: [obsidian-plugin/main.js, obsidian-plugin/manifest.json]

# The documentation is a datme garden; the default branch publishes it on GitLab Pages.
pages:
  needs: [test]
  script:
    - bun install --frozen-lockfile
    - bun bin/datme.ts build docs --out public --strict
  variables:
    GIT_DEPTH: 0
    DATME_CACHE: .datme-cache
  cache:
    - key: datme-docs
      paths: [.datme-cache/]
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
