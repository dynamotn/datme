# Type-check and test datme on every push and merge request, and release v* tags.
# Images are pinned to releases, so a pipeline runs the tools it was tested with.
image: oven/bun:1.4.2

variables:
  ASTRO_TELEMETRY_DISABLED: "1"

cache:
  key:
    files: [bun.lock]
  paths: [node_modules/]

# oven/bun has no git, which datme reads dates and history from, and its tests use.
.git: &git
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null

test:
  <<: *git
  # The full history: a shallow clone is a warning, and the documentation must pass --strict.
  variables:
    GIT_DEPTH: 0
  script:
    - bun install --frozen-lockfile
    # The findings as a code quality report on merge requests, and readable in the log when there are any.
    - bunx biome ci --colors=off --reporter=gitlab > gl-code-quality.json || (bunx biome ci; exit 1)
    - bunx astro check
    - bun test --coverage
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality.json

# Known advisories in the locked dependencies (bun audit reads bun.lock; nothing is installed).
# The whole report prints first; a high or critical advisory then fails the pipeline.
# bun audit cannot tell dev dependencies from those users install, so a dev-only one fails it too.
# One that cannot be fixed yet is skipped with --ignore=GHSA-…, on a line of its own here with a
# comment saying why it is safe to skip and which issue tracks it, removed once it is fixed.
audit:
  needs: []
  cache: []
  script:
    - bun audit || true
    - bun audit --audit-level=high

# The package as npm users get it: packed, installed from its tarball and run under
# each Node that `engines` allows (Bun packs it, so the job installs Bun as well).
package:
  needs: [test]
  image: node:${NODE}
  parallel:
    matrix:
      - NODE: ["22.18", "24", "25"]
  cache: []
  before_script:
    - npm install --global --no-audit --no-fund bun@1.4.2
  script:
    - bun install --frozen-lockfile
    - bun tools/pack-check.ts

# How datme scales (tools/bench.ts): builds, dev rebuilds, output and page weight on a generated
# vault, kept as bench.json. 10,000 notes take a while, so they run on the default branch and on
# a pipeline schedule, with the installed size too; a branch with an open merge request gets
# 1,000 notes, enough to catch a step change. It runs beside the tests, never delaying them, and
# only warns: shared runners time loosely. It compares with tools/bench-baseline.json once one
# taken on these runners is committed (a run or a list of runs, matched by --notes).
bench:
  needs: []
  image: node:24
  cache: []
  timeout: 90 minutes
  allow_failure: true
  variables:
    BENCH_NOTES: "10000"
    BENCH_FLAGS: --install
  before_script:
    - npm install --global --no-audit --no-fund bun@1.4.2
  script:
    - bun install --frozen-lockfile
    - bun tools/bench.ts --notes "$BENCH_NOTES" $BENCH_FLAGS --json bench.json --compare tools/bench-baseline.json
  artifacts:
    when: always
    paths: [bench.json]
    expire_in: 90 days
  # This project's CI minutes are limited and the 10,000-note run takes most of an hour, so it runs
  # on a schedule only; elsewhere it waits to be started by hand. GitHub, where minutes are free for
  # a public repository, runs it on every push to main (.github/workflows/bench.yml).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_OPEN_MERGE_REQUESTS
      when: manual
      variables:
        BENCH_NOTES: "1000"
        BENCH_FLAGS: ""
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# The documentation is a datme garden; the default branch publishes it on GitLab Pages.
pages:
  <<: *git
  needs: [test]
  script:
    - bun install --frozen-lockfile
    - bun bin/datme.ts build docs --out public --strict
  variables:
    GIT_DEPTH: 0
    DATME_CACHE: .datme-cache
  cache:
    - key: datme-docs
      paths: [.datme-cache/]
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The notes of a v* tag: its section of CHANGELOG.md. A tag without one fails here,
# so no release goes out without notes.
release-notes:
  stage: deploy
  needs: []
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - bun tools/release-notes.ts "$CI_COMMIT_TAG" > release-notes.md
    - echo "VERSION=${CI_COMMIT_TAG#v}" > release.env
  artifacts:
    paths: [release-notes.md]
    reports:
      dotenv: release.env

# A v* tag publishes a GitLab release once the tests pass, described by its notes.
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs: [test, release-notes]
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "Releasing ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: "@dynamotn/datme-${VERSION}.tgz (npm)"
          url: "https://registry.npmjs.org/@dynamotn/datme/-/datme-${VERSION}.tgz"
          link_type: package
        - name: GitHub release
          url: "https://github.com/dynamotn/datme/releases/tag/${CI_COMMIT_TAG}"
          link_type: other
