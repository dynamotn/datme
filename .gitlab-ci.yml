# Type-check and test datme on every push and merge request, and release v* tags.
# Images are pinned to releases, so a pipeline runs the tools it was tested with.
image: oven/bun:1.4.2

variables:
  ASTRO_TELEMETRY_DISABLED: "1"

cache:
  key:
    files: [bun.lock]
  paths: [node_modules/]

# oven/bun has no git, which datme reads dates and history from, and its tests use.
.git: &git
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null

test:
  <<: *git
  # The full history: a shallow clone is a warning, and the documentation must pass --strict.
  variables:
    GIT_DEPTH: 0
  script:
    - bun install --frozen-lockfile
    # The findings as a code quality report on merge requests, and readable in the log when there are any.
    - bunx biome ci --colors=off --reporter=gitlab > gl-code-quality.json || (bunx biome ci; exit 1)
    - bunx astro check
    - bun test --coverage
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality.json

# The package as npm users get it: packed, installed from its tarball and run under
# each Node that `engines` allows (Bun packs it, so the job installs Bun as well).
package:
  needs: [test]
  image: node:${NODE}
  parallel:
    matrix:
      - NODE: ["22.18", "24", "25"]
  cache: []
  before_script:
    - npm install --global --no-audit --no-fund bun@1.4.2
  script:
    - bun install --frozen-lockfile
    - bun tools/pack-check.ts

# The documentation is a datme garden; the default branch publishes it on GitLab Pages.
pages:
  <<: *git
  needs: [test]
  script:
    - bun install --frozen-lockfile
    - bun bin/datme.ts build docs --out public --strict
  variables:
    GIT_DEPTH: 0
    DATME_CACHE: .datme-cache
  cache:
    - key: datme-docs
      paths: [.datme-cache/]
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The notes of a v* tag: its section of CHANGELOG.md. A tag without one fails here,
# so no release goes out without notes.
release-notes:
  stage: deploy
  needs: []
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - bun tools/release-notes.ts "$CI_COMMIT_TAG" > release-notes.md
    - echo "VERSION=${CI_COMMIT_TAG#v}" > release.env
  artifacts:
    paths: [release-notes.md]
    reports:
      dotenv: release.env

# A v* tag publishes a GitLab release once the tests pass, described by its notes.
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs: [test, release-notes]
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "Releasing ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: "@dynamotn/datme-${VERSION}.tgz (npm)"
          url: "https://registry.npmjs.org/@dynamotn/datme/-/datme-${VERSION}.tgz"
          link_type: package
        - name: GitHub release
          url: "https://github.com/dynamotn/datme/releases/tag/${CI_COMMIT_TAG}"
          link_type: other
