# Mirror of .gitlab-ci.yml for the GitHub copy of the repository.
name: CI
on: [push, pull_request]

# Jobs read the repository; release asks for more on its own.
# Third-party actions are pinned to commits; the comment names the release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx astro check
      - run: bun test --coverage

  # Accessibility (with colour contrast, which needs a real browser), best practices and SEO
  # of the fixture site, measured by Lighthouse; reports are kept as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun bin/datme.ts build tests/fixtures/vault --out .lhci-site
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: .lhci-report

  # A v* tag publishes a GitHub release with the packed tarball, and the package
  # to npm when the NPM_TOKEN secret is set.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No install scripts while the job can write releases; packing needs none.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      # The npm token reaches this step only.
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish ./*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
