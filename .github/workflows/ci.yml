# Mirror of .gitlab-ci.yml for the GitHub copy of the repository.
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx astro check
      - run: bun test

  # Accessibility (with colour contrast, which needs a real browser), best practices and SEO
  # of the fixture site, measured by Lighthouse; reports are kept as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun bin/datme.ts build tests/fixtures/vault --out .lhci-site
      - run: npx --yes @lhci/cli@0.14.x autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lhci-report

  # A v* tag publishes a GitHub release with the packed tarball, and the package
  # to npm when the NPM_TOKEN secret is set.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish ./*.tgz --provenance --access public
