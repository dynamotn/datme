# Mirror of .gitlab-ci.yml for the GitHub copy of the repository.
name: CI
on: [push, pull_request]

# Jobs read the repository; release asks for more on its own.
# Third-party actions are pinned to commits; the comment names the release.
# Bun is pinned to the version of .gitlab-ci.yml: coverage counts lines differently across releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      # The full history: a shallow clone is a warning, and the documentation must pass --strict.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci --reporter=github
      - run: bunx astro check
      - run: bun test --coverage

  # The package as npm users get it: packed, installed from its tarball and run under
  # each Node that `engines` allows.
  package:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node: ["22.18", "24", "25"]
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun tools/pack-check.ts

  # Accessibility (with colour contrast, which needs a real browser), best practices and SEO
  # of the fixture site, measured by Lighthouse; reports are kept as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun bin/datme.ts build tests/fixtures/vault --out .lhci-site
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: .lhci-report

  # A v* tag publishes a GitHub release with the packed tarball, and the package
  # to npm through trusted publishing (OIDC), with no npm token stored anywhere.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No install scripts while the job can write releases; packing needs none.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm pack
      # A pre-release (v3.0.0-rc.1) is marked as one, and goes to npm's `next`
      # dist-tag so `latest` keeps pointing at the last stable release.
      - name: Is it a pre-release?
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "gh=--prerelease" >> "$GITHUB_OUTPUT"
            echo "npm=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${{ steps.kind.outputs.gh }} ./*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      # npm trusted publishing: the job's OIDC token (id-token: write) stands in for a
      # stored npm token, and npm adds the provenance attestation on its own.
      - name: Check npm can publish with OIDC (11.5.1 or later)
        run: |
          version="$(npm --version)"
          lowest="$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)"
          [[ "$lowest" == 11.5.1 ]] || { echo "npm $version cannot publish with OIDC; 11.5.1 or later can" >&2; exit 1; }
      - run: npm publish ./*.tgz --access public --tag ${{ steps.kind.outputs.npm }}
